<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles/dashboard.css">
    <script src="scripts/dashboard.js" defer></script>
</head>
<body class="site" id="site">
    <div class="viewDiv">
        <div class="sidebar">
            <div class="logoDiv">
                <img src="assets/logo.png" alt="logo" class="logo">
                <h1 class="titleText">Dashboard</h1>
            </div>
            <button class="siteBarOverviewBTN"><img src="assets/house-fill.svg" alt="homeIcon" class="siteBarOverviewBTNIcon"><p class="siteBarOverviewBTNText">Overview</p></button>
            <button class="siteBarProgramsBTN"><img src="assets/download.svg" alt="programsIcon" class="siteBarProgramsBTNIcon"><p class="siteBarProgramsBTNText">Programs</p></button>
            <button class="siteBarWebAppsBTN"><img src="assets/globe.svg" alt="webAppIcon" class="siteBarWebAppsBTNIcon"><p class="siteBarWebAppsBTNText">Web Apps</p></button>
            <button class="siteBarUserBTN"><img src="assets/people-fill.svg" alt="userIcon" class="siteBarUserBTNIcon"><p class="siteBarUserBTNText">User</p></button>
            <button class="siteBarSystemBTN", id="settingsButton"><img src="assets/gear-fill.svg" alt="systemIcon" class="siteBarSystemBTNIcon"><p class="siteBarSystemBTNText">Settings</p></button>
            <hr class="siteBarHR">
            <p>Admin btn</p>
            <div class="siteBarSpace"></div>
            <p class="siteBarVersionText" id="siteBarVersionText"></p>
        </div>
        <div class="viewTwoDiv">
            <div class="navbar">
                <input type="search" class="searchBar" placeholder="Search Programs">
                <div class="navbarSpacer"></div>
                <button class="notificationBTN"><img src="assets/bell.svg" alt="notificationIcon" class="notificationBTNIcon"></button>
                <button class="userBTN" id="userBTN"><img src="" alt=""><p class="userNameText" id="userNameText"></p></button>
                <div class="dropdown", id="dropdown">
                    <button class="dropdownProfileBTN"><img src="assets/person-fill.svg" alt="" class="dropdownProfileIcon"><p class="dropdownProfileBTNText">Profile</p></button>
                    <button class="dropdownSettingsBTN" id="settingsButtonDropdown"><img src="assets/gear-fill.svg" alt="" class="dropdownSettingsIcon"><p class="dropdownSettingsBTNText">Settings</p></button>
                    <button class="dropdownAdminBTN"><img src="assets/shield-shaded.svg" alt="" class="dropdownAdminIcon"><p class="dropdownAdminBTNText">Admin</p></button>
                    <button class="dropdownLogoutBTN" id="logoutBTN"><img src="assets/box-arrow-right.svg" alt="" class="dropdownLogoutIcon"><p class="dropdownLogoutBTNText">Logout</p></button>
                </div>
            </div>
            <div class="mainPageDiv">
                <div class="greatingDiv">
                        <h1 class="greatingTitle" id="greatingTitle"></h1>
                </div>

            </div>
        </div>
        
    </div>
    <div class="overlay" id="settingsPopup">
        <div class="popup">
            <div class="popupSitebar">
                <button class="settingsAccountBTN" onclick="showSettingsPage('accountSettingsDiv')"><img src="" alt=""><p>Account</p></button>
            </div>
            <div class="popupScreen">
                <div class="settingsContent", id="settingsContent">
                    <!-- <button class="settingsCloseBTN", id="settingsCloseBTN"><img src="assets/x.svg" alt="" class="settingsCloseIcon"></button> -->
                    <div class="settingSite" id="accountSettingsDiv">
                        <p class="settingsAccountTitle">Account</p>
                        <div style="display: flex; flex-direction: row;">
                            <div class="accountSettingsProfileDiv">
                                <div>
                                    <img src="" alt="">
                                    <p></p>
                                    <button><img src="" alt=""><p>Change profile picture</p></button>
                                </div>
                                <p>username:</p>
                                <input type="text">
                            </div>
                            <div style="display: flex; flex-direction: column;">
                                <div class="accountSettingsInfoDiv">
                                    <div>
                                        <img src="" alt="">
                                        <p class="accountSettingsInfoTitle">Account details</p>
                                    </div>
                                    <div>
                                        <img src="" alt="">
                                        <p>User-UUID</p>
                                        <p></p>
                                    </div>
                                    <div>
                                        <img src="" alt="">
                                        <p>Registered on</p>
                                        <p></p>
                                    </div>
                                    <div>
                                        <img src="" alt="">
                                        <p>Last login</p>
                                        <p></p>
                                    </div>
                                </div>
                                <div class="accountSettingsManageDiv">
                                    <div>
                                        <img src="" alt="">
                                        <p>Manage account</p>
                                    </div>
                                    <button><img src="" alt=""><p>Change Password</p></button>
                                    <button><img src="" alt=""><p>Delete account</p></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="settingSite" id="testSettingsDiv">
                        <h1>nichts</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="notification" id="notification">
        <div class="notificationPopup">
            <div class="notificationTitleBarDiv">
                <p class="notificationTitle" id="notificationTitle">title</p>
                <button class="notificationCloseBTN" id="notificationCloseBTN"><img src="assets/x.svg" alt="" class="notificationCloseBTNIcon"></button>
            </div>
            <div class="notificationMessageDiv">
                <p class="notificationMessage" id="notificationMessage">message</p>
            </div>
            <button class="notificationCloseBTN2" id="notificationCloseBTN2"><p class="notificationCloseBTN2Text">Close</p></button>
        </div>
    </div>
</body>
</html>
