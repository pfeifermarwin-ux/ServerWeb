<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles/register.css">
    <script src="scripts/register.js" defer></script>
</head>
<body class="site">
    <div class="loginForm">
        <h2 class="formTitle">Register</h2>
        <input class="userNameInput" type="text" id="username" placeholder="Username"><br>
        <input class="passwordInput" type="password" id="password" placeholder="Password"><br>
        <label class="errorLabel" id="errorLabel"></label><br>
        <button class="registerButton" id="registerButton">Register</button>
        <button class="loginButton" id="loginButton">Login</button>
    </div>
</body>
</html>
